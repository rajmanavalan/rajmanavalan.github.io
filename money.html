<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Budget & Expense Tracker</title>

<style>
:root{
    --primary:#2563eb;
    --success:#22c55e;
    --warning:#f59e0b;
    --danger:#ef4444;
    --bg:#f3f4f6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI,sans-serif;
    background:var(--bg);
}

h1,h2{
    color:#1f2937;
}

.section{
    background:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    width:100%;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    color:white;
}

.btnPrimary{background:var(--primary);}
.btnSuccess{background:var(--success);}
.btnDanger{background:var(--danger);}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
    color:#4b5563;
}

.value{
    font-size:28px;
    font-weight:bold;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.progress{
    width:100%;
    height:24px;
    background:#e5e7eb;
    border-radius:50px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    transition:.5s;
    text-align:center;
    color:white;
    font-weight:bold;
    line-height:24px;
}

.bar{
    margin:12px 0;
}

.bar-label{
    display:flex;
    justify-content:space-between;
    margin-bottom:4px;
}

.bar-fill{
    height:22px;
    border-radius:8px;
}

@media(max-width:700px){
    .row{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<h1>💰 Quick Budget Dashboard</h1>

<div class="section">

<h2>Income</h2>

<div class="row">
    <input type="number"
           id="incomeAmount"
           placeholder="Income Amount">

    <button class="btnPrimary"
            onclick="saveIncome()">
        Save Income
    </button>
</div>

</div>

<div class="section">

<h2>Budget</h2>

<div class="row">

    <input id="budgetDesc"
           placeholder="Category">

    <input id="budgetValue"
           type="number"
           placeholder="Amount">

    <button class="btnSuccess"
            onclick="addBudget()">
            Add Budget
    </button>

</div>

<div id="budgetList"></div>

</div>

<div class="section">

<h2>Expenses</h2>

<div class="row">

    <input id="expenseDesc"
           placeholder="Description">

    <input id="expenseValue"
           type="number"
           placeholder="Amount">

    <button class="btnDanger"
            onclick="addExpense()">
            Add Expense
    </button>

</div>

<div id="expenseList"></div>

</div>

<h2>Dashboard</h2>

<div class="grid">

<div class="card">
<h3>💰 Income</h3>
<div id="incomeCard" class="value">£0</div>
</div>

<div class="card">
<h3>🎯 Budget</h3>
<div id="budgetCard" class="value">£0</div>
</div>

<div class="card">
<h3>💸 Expenses</h3>
<div id="expenseCard" class="value">£0</div>
</div>

<div class="card">
<h3>⚖ Budget Remaining</h3>
<div id="budgetRemainCard"
     class="value">£0</div>
</div>

<div class="card">
<h3>✅ Remaining Balance</h3>
<div id="balanceCard"
     class="value">£0</div>
</div>

<div class="card">
<h3>📊 Budget Usage</h3>

<div class="progress">
    <div id="usageProgress"
         class="progress-fill">
         0%
    </div>
</div>

</div>

</div>

<div class="section">

<h2>Visual Analysis</h2>

<h3>Budget vs Expense</h3>

<div class="bar">

<div class="bar-label">
    <span>Budget</span>
    <span id="budgetBarValue">£0</span>
</div>

<div style="background:#e5e7eb;border-radius:8px;">
<div id="budgetBar"
     class="bar-fill"
     style="width:0%;background:#2563eb;">
</div>
</div>

</div>

<div class="bar">

<div class="bar-label">
    <span>Expenses</span>
    <span id="expenseBarValue">£0</span>
</div>

<div style="background:#e5e7eb;border-radius:8px;">
<div id="expenseBar"
     class="bar-fill"
     style="width:0%;background:#ef4444;">
</div>
</div>

</div>

<h3>Expense Breakdown</h3>

<div id="expenseBreakdown"></div>

</div>

<script>

let db;

const req =
indexedDB.open(
    "BudgetDashboardDB",1);

req.onupgradeneeded=e=>{

    db=e.target.result;

    db.createObjectStore(
        "settings",
        {keyPath:"id"});

    db.createObjectStore(
        "budgets",
        {keyPath:"id",autoIncrement:true});

    db.createObjectStore(
        "expenses",
        {keyPath:"id",autoIncrement:true});
};

req.onsuccess=e=>{

    db=e.target.result;

    render();
};

function money(v){

    return "£" +
    Number(v).toLocaleString(
        "en-GB",
        {
            minimumFractionDigits:2
        });
}

function saveIncome(){

    let income=
    Number(
    incomeAmount.value||0);

    let tx=
    db.transaction(
        ["settings"],
        "readwrite");

    tx.objectStore(
        "settings")
      .put({
        id:1,
        income:income
      });

    tx.oncomplete=render;
}

function addBudget(){

    if(!budgetDesc.value ||
       !budgetValue.value)
       return;

    let tx=
    db.transaction(
        ["budgets"],
        "readwrite");

    tx.objectStore(
        "budgets")
      .add({
        description:budgetDesc.value,
        amount:Number(
               budgetValue.value)
      });

    tx.oncomplete=()=>{

        budgetDesc.value="";
        budgetValue.value="";

        render();
    };
}

function addExpense(){

    if(!expenseDesc.value ||
       !expenseValue.value)
       return;

    let tx=
    db.transaction(
        ["expenses"],
        "readwrite");

    tx.objectStore(
        "expenses")
      .add({

        description:
            expenseDesc.value,

        amount:Number(
            expenseValue.value)
      });

    tx.oncomplete=()=>{

        expenseDesc.value="";
        expenseValue.value="";

        render();
    };
}

function deleteBudget(id){

    let tx=
    db.transaction(
        ["budgets"],
        "readwrite");

    tx.objectStore(
        "budgets")
      .delete(id);

    tx.oncomplete=render;
}

function deleteExpense(id){

    let tx=
    db.transaction(
        ["expenses"],
        "readwrite");

    tx.objectStore(
        "expenses")
      .delete(id);

    tx.oncomplete=render;
}

function render(){

Promise.all([

new Promise(r=>{

db.transaction(
["settings"])
.objectStore(
"settings")
.get(1)
.onsuccess=e=>
r(
e.target.result ||
{income:0});
}),

new Promise(r=>{

db.transaction(
["budgets"])
.objectStore(
"budgets")
.getAll()
.onsuccess=e=>
r(
e.target.result);
}),

new Promise(r=>{

db.transaction(
["expenses"])
.objectStore(
"expenses")
.getAll()
.onsuccess=e=>
r(
e.target.result);
})

]).then(([settings,budgets,expenses])=>{

let income=
Number(settings.income||0);

incomeAmount.value=
income;

let budget=0;
let expense=0;

let budgetHtml="";
let expenseHtml="";

budgets.forEach(x=>{

budget += x.amount;

budgetHtml += `
<div class="item">
<span>${x.description}</span>
<span>
${money(x.amount)}
<button onclick="deleteBudget(${x.id})">
❌
</button>
</span>
</div>`;
});

expenses.forEach(x=>{

expense += x.amount;

expenseHtml += `
<div class="item">
<span>${x.description}</span>
<span>
${money(x.amount)}
<button onclick="deleteExpense(${x.id})">
❌
</button>
</span>
</div>`;
});

budgetList.innerHTML=
budgetHtml;

expenseList.innerHTML=
expenseHtml;

const budgetRemaining=
budget-expense;

const balance=
income-expense;

const budgetUsage=
budget>0
?
(expense/budget)*100
:
0;

incomeCard.innerText=
money(income);

budgetCard.innerText=
money(budget);

expenseCard.innerText=
money(expense);

budgetRemainCard.innerText=
money(budgetRemaining);

balanceCard.innerText=
money(balance);

const fill=
document.getElementById(
"usageProgress");

fill.style.width=
Math.min(
budgetUsage,
100
)+"%";

fill.innerText=
budgetUsage.toFixed(1)
+"%";

fill.style.background=
budgetUsage<70
?"#22c55e"
:budgetUsage<90
?"#f59e0b"
:"#ef4444";

const max=
Math.max(
budget,
expense,
1);

budgetBar.style.width=
((budget/max)*100)+
"%";

expenseBar.style.width=
((expense/max)*100)+
"%";

budgetBarValue.innerText=
money(budget);

expenseBarValue.innerText=
money(expense);

let breakdown="";

expenses.forEach(x=>{

const pct=
expense>0
?
((x.amount/expense)*100)
.toFixed(1)
:0;

breakdown += `
<div style="margin-bottom:12px;">
<div class="bar-label">
<span>${x.description}</span>
<span>${pct}%</span>
</div>

<div style="
background:#e5e7eb;
border-radius:8px;">
<div style="
width:${pct}%;
height:20px;
background:#ef4444;
border-radius:8px;">
</div>
</div>
</div>`;
});

expenseBreakdown.innerHTML=
breakdown;

});
}

</script>

</body>
</html>
