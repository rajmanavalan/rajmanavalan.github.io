<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning Activity Tracker</title>

<style>
:root{
    --success:#22c55e;
    --warning:#f59e0b;
    --danger:#ef4444;
    --primary:#2563eb;
    --purple:#8b5cf6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f3f4f6;
}

h1{
    margin-top:0;
    color:#1f2937;
}

.topnav{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.topnav a{
    display:inline-block;
    text-decoration:none;
    background:white;
    color:#1f2937;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.topnav a.active{
    background:var(--primary);
    color:white;
}

.header{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input{
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    min-width:220px;
}

button{
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.stats{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:15px;
    border-radius:12px;
    min-width:180px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat h3{
    margin:0 0 8px 0;
    font-size:15px;
}

.stat div{
    font-size:26px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
}

.status{
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    color:white;
    font-weight:bold;
    margin-top:12px;
}

.green{
    background:var(--success);
}

.amber{
    background:var(--warning);
}

.red{
    background:var(--danger);
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.cleanBtn{
    background:var(--success);
    color:white;
}

.dateBtn{
    background:var(--primary);
    color:white;
}

.renameBtn{
    background:var(--purple);
    color:white;
}

.deleteBtn{
    background:var(--danger);
    color:white;
}

.info{
    margin-top:8px;
    color:#4b5563;
}

.switchRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #e5e7eb;
}

.toggleLabel{
    font-size:13px;
    font-weight:700;
    color:#374151;
}

.switch{
    position:relative;
    display:inline-block;
    width:52px;
    height:30px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:#d1d5db;
    border-radius:999px;
    transition:all .2s ease;
}

.slider:before{
    content:"";
    position:absolute;
    height:22px;
    width:22px;
    left:4px;
    top:4px;
    border-radius:50%;
    background:white;
    transition:all .2s ease;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.switch input:checked + .slider{
    background:var(--primary);
}

.switch input:checked + .slider:before{
    transform:translateX(22px);
}

.overdue{
    color:var(--danger);
    font-weight:bold;
}

@media(max-width:600px){

    .header{
        flex-direction:column;
    }

    input{
        width:100%;
    }
}
</style>
</head>
<body>

<nav class="topnav">
    <a href="device.html">Device Tracker</a>
    <a href="clean.html" class="active">Cleaning Tracker</a>
</nav>

<h1>🧹 Cleaning Activity Tracker</h1>

<div class="stats">

    <div class="stat">
        <h3>Total Areas</h3>
        <div id="totalAreas">0</div>
    </div>

    <div class="stat">
        <h3>Cleaning Due</h3>
        <div id="dueCount">0</div>
    </div>

</div>

<div class="header">

    <input
        type="text"
        id="areaName"
        placeholder="Area / Equipment Name">

    <button class="btn-primary"
            onclick="addArea()">
        Add Cleaning Item
    </button>

    <input
        type="text"
        id="searchBox"
        placeholder="Search..."
        onkeyup="loadAreas()">

</div>

<div id="cards" class="cards"></div>

<script>

let db;

const request = indexedDB.open("CleaningTrackerDB", 1);

request.onupgradeneeded = function(event){

    db = event.target.result;

    if(!db.objectStoreNames.contains("areas")){

        let store = db.createObjectStore(
            "areas",
            {
                keyPath:"id",
                autoIncrement:true
            }
        );

        store.createIndex(
            "name",
            "name",
            { unique:false }
        );
    }
};

request.onsuccess = function(event){

    db = event.target.result;

    loadAreas();
};

function addArea(){

    const name = document
        .getElementById("areaName")
        .value
        .trim();

    if(!name){

        alert("Please enter an area name.");
        return;
    }

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    let store = tx.objectStore("areas");

    store.add({
        name:name,
        lastCleaned:new Date().toISOString()
    });

    tx.oncomplete = function(){

        document.getElementById("areaName").value = "";

        loadAreas();
    };
}

function getStatus(days, item = {}){

    const customEnabled = !!item.useCustomDays;
    const overrideDays = Number(item.overrideDays) || 7;
    const threshold = customEnabled ? overrideDays : 7;
    const warningThreshold = Math.max(0, threshold - 2);

    if(days >= threshold){

        return {
            cls:"red",
            text: customEnabled ? "Due" : "Cleaning Due",
            buttonText: customEnabled ? "Actioned Today" : "Cleaned Today"
        };
    }

    if(days >= warningThreshold){

        return {
            cls:"amber",
            text: customEnabled ? "Due Soon" : "Cleaning Due Soon",
            buttonText: customEnabled ? "Actioned Today" : "Cleaned Today"
        };
    }

    return {
        cls:"green",
        text: customEnabled ? "Recently Done" : "Recently Cleaned",
        buttonText: customEnabled ? "Actioned Today" : "Cleaned Today"
    };
}

function toggleCustomMode(id, enabled){

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    let store = tx.objectStore("areas");
    let req = store.get(id);

    req.onsuccess = function(){

        let item = req.result;

        if(enabled){

            const defaultDays = Number(item.overrideDays) || 7;

            let overrideDays = prompt(
                "How many days should override the cleaning cycle?",
                defaultDays
            );

            if(overrideDays === null)
                return;

            overrideDays = Number(overrideDays);

            if(!Number.isInteger(overrideDays) || overrideDays < 1){

                alert("Please enter a valid whole number of days greater than 0.");
                return;
            }

            item.useCustomDays = true;
            item.overrideDays = overrideDays;
        }
        else{
            item.useCustomDays = false;
        }

        store.put(item);
        loadAreas();
    };
}

function markCleaned(id){

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    let store = tx.objectStore("areas");

    let req = store.get(id);

    req.onsuccess = function(){

        let item = req.result;

        item.lastCleaned =
            new Date().toISOString();

        store.put(item);

        loadAreas();
    };
}

function editDate(id){

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    let store = tx.objectStore("areas");

    let req = store.get(id);

    req.onsuccess = function(){

        let item = req.result;

        let currentDate =
            item.lastCleaned.substring(0,10);

        let newDate = prompt(
            "Enter cleaning date (YYYY-MM-DD)",
            currentDate
        );

        if(!newDate)
            return;

        let dt = new Date(newDate);

        if(isNaN(dt)){

            alert("Invalid date");
            return;
        }

        item.lastCleaned =
            dt.toISOString();

        store.put(item);

        loadAreas();
    };
}

function renameArea(id){

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    let store = tx.objectStore("areas");

    let req = store.get(id);

    req.onsuccess = function(){

        let item = req.result;

        let newName = prompt(
            "Enter new name",
            item.name
        );

        if(!newName)
            return;

        newName = newName.trim();

        if(newName.length === 0){

            alert(
                "Name cannot be empty."
            );

            return;
        }

        item.name = newName;

        store.put(item);

        loadAreas();
    };
}

function deleteArea(id){

    if(!confirm(
        "Delete this cleaning item?"
    ))
        return;

    let tx = db.transaction(
        ["areas"],
        "readwrite"
    );

    tx.objectStore("areas")
      .delete(id);

    tx.oncomplete = function(){

        loadAreas();
    };
}

function loadAreas(){

    let tx = db.transaction(
        ["areas"],
        "readonly"
    );

    let store =
        tx.objectStore("areas");

    let req = store.getAll();

    req.onsuccess = function(){

        let data = req.result;

        let search = document
            .getElementById("searchBox")
            .value
            .toLowerCase();

        if(search){

            data = data.filter(x =>
                x.name.toLowerCase()
                .includes(search)
            );
        }

        render(data);
    };
}

function render(data){

    let html = "";
    let dueCount = 0;

    data.sort((a,b)=>{

        let d1 =
            Math.floor(
                (new Date() -
                 new Date(a.lastCleaned))
                 /(1000*60*60*24)
            );

        let d2 =
            Math.floor(
                (new Date() -
                 new Date(b.lastCleaned))
                 /(1000*60*60*24)
            );

        return d2 - d1;
    });

    data.forEach(item=>{

        const days =
            Math.floor(
                (new Date() -
                new Date(item.lastCleaned))
                /(1000*60*60*24)
            );

        const status =
            getStatus(days, item);

        if(status.cls==="red")
            dueCount++;

        const threshold =
            item.useCustomDays
            ? (Number(item.overrideDays) || 7)
            : 7;

        const overdue =
            days >= threshold
            ? `(Overdue by ${Math.max(days-threshold, 0)} day(s))`
            : "";

        html += `
        <div class="card">

            <h3 >${item.name}&nbsp;<span style="cursor:pointer;" onclick="renameArea(${item.id})">✏️</span></h3> 

            <div class="info">
                Last Cleaned:
                <strong>
                ${new Date(item.lastCleaned)
                .toLocaleDateString()}
                </strong>
            </div>

            <div class="info">
                Days Since Cleaning:
                <strong>${days}</strong>
            </div>

            <div class="info">
                Assigned Days:
                <strong>${item.useCustomDays ? `${item.overrideDays}d` : "7d"}</strong>
            </div>

            <div class="info overdue">
                ${overdue}
            </div>

            <div class="status ${status.cls}">
                ${status.text}
            </div>

            <div class="switchRow">
                <span class="toggleLabel">Custom days</span>
                <label class="switch">
                    <input
                        type="checkbox"
                        ${item.useCustomDays ? "checked" : ""}
                        onchange="toggleCustomMode(${item.id}, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="actions">

                <button
                    class="cleanBtn"
                    onclick="markCleaned(${item.id})">
                    ✓ ${status.buttonText}
                </button>

                <button
                    class="dateBtn"
                    onclick="editDate(${item.id})">
                    📅 Change Date
                </button>

                <button
                    class="deleteBtn"
                    onclick="deleteArea(${item.id})">
                    🗑 Delete
                </button>

            </div>

        </div>`;
    });

    document.getElementById("cards")
        .innerHTML = html;

    document.getElementById("totalAreas")
        .innerText = data.length;

    document.getElementById("dueCount")
        .innerText = dueCount;
}

</script>

</body>
</html>
